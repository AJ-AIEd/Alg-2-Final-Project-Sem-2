<svg width="1280" height="820" viewBox="0 0 1280 820" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1280" height="820" rx="36" fill="#FBFCFE"/>
  <rect x="28" y="28" width="1224" height="764" rx="30" fill="#FFFFFF" stroke="#D8E0EA" stroke-width="2"/>

  <text x="70" y="78" fill="#111827" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="850">One System. Multiple Mathematical Stories.</text>
  <text x="72" y="110" fill="#64748B" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="650">Demand, infrastructure, and storage do not move at the same speed.</text>

  <g transform="translate(86 150)">
    <rect width="1108" height="514" rx="22" fill="#F8FAFC" stroke="#D8E0EA"/>
    <g opacity=".72">
      <path d="M82 70H1038M82 132H1038M82 194H1038M82 256H1038M82 318H1038M82 380H1038M82 442H1038" stroke="#E2E8F0"/>
      <path d="M82 70V450M192 70V450M302 70V450M412 70V450M522 70V450M632 70V450M742 70V450M852 70V450M962 70V450" stroke="#E2E8F0"/>
    </g>

    <path d="M82 450H1040" stroke="#1F2937" stroke-width="2.2"/>
    <path d="M82 450V68" stroke="#1F2937" stroke-width="2.2"/>
    <text x="32" y="158" fill="#64748B" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="750" transform="rotate(-90 32 158)">Normalized index, 2025 = 100</text>
    <text x="922" y="486" fill="#64748B" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="750">Year, 2024–2050</text>

    <g fill="#64748B" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="700">
      <text x="70" y="474">2024</text>
      <text x="250" y="474">2029</text>
      <text x="435" y="474">2034</text>
      <text x="620" y="474">2039</text>
      <text x="804" y="474">2044</text>
      <text x="996" y="474">2050</text>
      <text x="42" y="454">40</text>
      <text x="42" y="330">80</text>
      <text x="36" y="268">100</text>
      <text x="36" y="206">120</text>
      <text x="36" y="144">140</text>
    </g>

    <path d="M118 256C190 257 264 260 338 263C412 267 486 272 560 276C634 281 708 285 782 289C856 293 930 297 1002 300" stroke="#15803D" stroke-width="5" stroke-linecap="round"/>
    <path d="M118 256C190 253 264 248 338 240C412 232 486 220 560 206C634 190 708 171 782 149C856 126 930 99 1002 68" stroke="#2563EB" stroke-width="5.5" stroke-linecap="round"/>

    <path d="M118 444C128 449 138 452 148 450C158 449 168 444 178 439" stroke="#7E22CE" stroke-width="6" stroke-linecap="round"/>
    <path d="M118 444C142 451 161 448 178 439C230 411 270 324 300 247C326 183 356 153 390 168C431 186 456 239 480 278" stroke="#7E22CE" stroke-width="5.2" stroke-linecap="round" stroke-dasharray="0 0"/>
    <path d="M480 278C530 346 588 364 652 335" stroke="#7E22CE" stroke-width="4" stroke-linecap="round" stroke-dasharray="8 9" opacity=".55"/>

    <path d="M720 70V450" stroke="#B45309" stroke-width="3" stroke-dasharray="8 8"/>
    <circle cx="720" cy="170" r="8" fill="#B45309"/>
    <rect x="738" y="122" width="210" height="66" rx="14" fill="#FFF7ED" stroke="#FED7AA"/>
    <text x="756" y="151" fill="#9A3412" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="850">Threshold</text>
    <text x="756" y="172" fill="#9A3412" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="650">demand pressure exceeds capacity</text>

    <circle cx="118" cy="444" r="7" fill="#7E22CE"/>
    <circle cx="128" cy="449" r="7" fill="#7E22CE"/>
    <circle cx="148" cy="450" r="7" fill="#7E22CE"/>
    <circle cx="300" cy="247" r="7" fill="#7E22CE"/>
    <circle cx="448" cy="278" r="7" fill="#7E22CE"/>

    <g font-family="Inter, Arial, sans-serif">
      <rect x="124" y="356" width="236" height="68" rx="14" fill="#FFFFFF" stroke="#CBD5E1"/>
      <text x="142" y="383" fill="#7E22CE" font-size="14" font-weight="850">Short data windows can mislead.</text>
      <text x="142" y="404" fill="#475569" font-size="12">April 2024 looked like collapse.</text>

      <rect x="392" y="286" width="224" height="64" rx="14" fill="#FFFFFF" stroke="#CBD5E1"/>
      <text x="410" y="313" fill="#7E22CE" font-size="14" font-weight="850">Storage recovery is nonlinear.</text>
      <text x="410" y="334" fill="#475569" font-size="12">Local model, not a forever prediction.</text>

      <rect x="654" y="56" width="178" height="52" rx="14" fill="#FFFFFF" stroke="#CBD5E1"/>
      <text x="672" y="86" fill="#2563EB" font-size="14" font-weight="850">Demand compounds.</text>

      <rect x="690" y="292" width="230" height="58" rx="14" fill="#FFFFFF" stroke="#CBD5E1"/>
      <text x="708" y="320" fill="#15803D" font-size="14" font-weight="850">Infrastructure responds more slowly.</text>
      <text x="708" y="340" fill="#475569" font-size="12">Linear here means incremental capacity.</text>

      <rect x="840" y="382" width="188" height="52" rx="14" fill="#F1F5F9" stroke="#CBD5E1"/>
      <text x="858" y="412" fill="#334155" font-size="14" font-weight="850">Every model leaves something out.</text>
    </g>

    <g font-family="Inter, Arial, sans-serif" font-size="12" font-weight="750">
      <rect x="110" y="26" width="16" height="7" rx="3.5" fill="#2563EB"/>
      <text x="134" y="34" fill="#475569">Demand pressure index: D(t)=100(1+r)^t</text>
      <rect x="405" y="26" width="16" height="7" rx="3.5" fill="#15803D"/>
      <text x="429" y="34" fill="#475569">Supply response index: S(t)=100+kt</text>
      <rect x="668" y="26" width="16" height="7" rx="3.5" fill="#7E22CE"/>
      <text x="692" y="34" fill="#475569">Chingaza storage stability: local nonlinear fit</text>
    </g>

    <g fill="#334155" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="700">
      <text x="96" y="466">16.32%</text>
      <text x="111" y="468">14.9%</text>
      <text x="157" y="432">17.07%</text>
      <text x="286" y="236">42.76%</text>
      <text x="414" y="300">41.33%</text>
    </g>
  </g>

  <g transform="translate(86 690)" font-family="Inter, Arial, sans-serif">
    <rect width="1108" height="62" rx="18" fill="#111827"/>
    <text x="26" y="38" fill="#FFFFFF" font-size="16" font-weight="850">April crisis window</text>
    <path d="M184 32H244" stroke="#94A3B8" stroke-width="2"/>
    <path d="M244 32L231 25M244 32L231 39" stroke="#94A3B8" stroke-width="2"/>
    <text x="266" y="38" fill="#FFFFFF" font-size="16" font-weight="850">Historical recovery</text>
    <path d="M418 32H478" stroke="#94A3B8" stroke-width="2"/>
    <path d="M478 32L465 25M478 32L465 39" stroke="#94A3B8" stroke-width="2"/>
    <text x="500" y="38" fill="#FFFFFF" font-size="16" font-weight="850">Future demand</text>
    <path d="M636 32H696" stroke="#94A3B8" stroke-width="2"/>
    <path d="M696 32L683 25M696 32L683 39" stroke="#94A3B8" stroke-width="2"/>
    <text x="718" y="38" fill="#FFFFFF" font-size="16" font-weight="850">Capacity threshold</text>
    <path d="M878 32H938" stroke="#94A3B8" stroke-width="2"/>
    <path d="M938 32L925 25M938 32L925 39" stroke="#94A3B8" stroke-width="2"/>
    <text x="960" y="38" fill="#FFFFFF" font-size="16" font-weight="850">Better question</text>
  </g>

  <text x="72" y="782" fill="#64748B" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="650">Sources: Bogotá official reservoir reports, Acueducto de Bogotá reporting, Reuters context reporting, and DANE population projections. Models shown are normalized for comparison and are meant for critique, not certainty.</text>
</svg>
