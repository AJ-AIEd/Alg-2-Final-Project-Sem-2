<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-labelledby="title desc">
  <title id="title">Interconnected food system under pressure</title>
  <desc id="desc">A modern network diagram showing climate, labor, transportation, storage, supply, demand, waste, exports, price, and affordability connected in one food system.</desc>
  <defs>
    <linearGradient id="surface" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset=".58" stop-color="#eef6f4"/>
      <stop offset="1" stop-color="#f7f5ff"/>
    </linearGradient>
    <linearGradient id="core" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#eef2ff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#0f172a" flood-opacity=".12"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.4" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10Z" fill="#64748b"/>
    </marker>
    <style>
      .label { font-family: Inter, Arial, sans-serif; fill: #0f172a; font-weight: 800; }
      .small { font-family: Inter, Arial, sans-serif; fill: #475569; font-weight: 650; }
      .micro { font-family: Inter, Arial, sans-serif; fill: #64748b; font-weight: 650; }
      .link { fill: none; stroke: #94a3b8; stroke-width: 2.7; stroke-linecap: round; marker-end: url(#arrow); }
      .soft-link { fill: none; stroke: #cbd5e1; stroke-width: 2; stroke-linecap: round; }
    </style>
  </defs>

  <rect width="960" height="560" rx="34" fill="url(#surface)"/>

  <g opacity=".72">
    <path class="soft-link" d="M220 122 C322 64 467 70 565 138"/>
    <path class="soft-link" d="M656 124 C755 156 817 228 822 326"/>
    <path class="soft-link" d="M748 423 C646 500 508 505 393 452"/>
    <path class="soft-link" d="M295 440 C180 386 135 294 171 187"/>
    <path class="soft-link" d="M210 122 C332 198 488 185 642 124"/>
    <path class="soft-link" d="M165 340 C322 286 503 303 760 424"/>
  </g>

  <g class="links">
    <path class="link" d="M250 122 C314 147 365 190 405 231"/>
    <path class="link" d="M626 126 C584 161 552 195 526 231"/>
    <path class="link" d="M787 237 C710 238 642 249 571 266"/>
    <path class="link" d="M778 337 C706 325 638 314 572 299"/>
    <path class="link" d="M650 437 C606 395 566 359 525 329"/>
    <path class="link" d="M322 437 C364 394 400 359 435 329"/>
    <path class="link" d="M175 337 C246 327 319 312 388 294"/>
    <path class="link" d="M177 237 C249 241 321 250 389 267"/>
    <path class="link" d="M438 234 C393 178 337 144 250 122"/>
    <path class="link" d="M523 326 C567 387 604 417 650 437"/>
  </g>

  <g filter="url(#shadow)">
    <g transform="translate(360 218)">
      <rect width="240" height="124" rx="24" fill="url(#core)" stroke="#dbe3ef"/>
      <text class="label" x="120" y="43" text-anchor="middle" font-size="23">Food System</text>
      <text class="small" x="120" y="72" text-anchor="middle" font-size="15">availability, price,</text>
      <text class="small" x="120" y="94" text-anchor="middle" font-size="15">access, and tradeoffs</text>
    </g>

    <g transform="translate(104 76)">
      <rect width="184" height="92" rx="19" fill="#ffffff" stroke="#d9e7df"/>
      <circle cx="36" cy="35" r="13" fill="#dcfce7"/>
      <path d="M28 36c12-16 22-14 31 0" fill="none" stroke="#15803d" stroke-width="3" stroke-linecap="round"/>
      <text class="label" x="64" y="38" font-size="17">Climate</text>
      <text class="micro" x="64" y="62" font-size="12">rainfall, yield</text>
    </g>

    <g transform="translate(552 78)">
      <rect width="204" height="92" rx="19" fill="#ffffff" stroke="#dbeafe"/>
      <circle cx="36" cy="35" r="13" fill="#dbeafe"/>
      <path d="M29 42h27M34 33h17" fill="none" stroke="#2563eb" stroke-width="3" stroke-linecap="round"/>
      <text class="label" x="64" y="38" font-size="17">Transportation</text>
      <text class="micro" x="64" y="62" font-size="12">fuel, distance, delay</text>
    </g>

    <g transform="translate(756 194)">
      <rect width="148" height="88" rx="19" fill="#ffffff" stroke="#e2e8f0"/>
      <circle cx="34" cy="34" r="13" fill="#e2e8f0"/>
      <path d="M28 34h21M38 25v18" fill="none" stroke="#334155" stroke-width="3" stroke-linecap="round"/>
      <text class="label" x="58" y="38" font-size="17">Storage</text>
      <text class="micro" x="58" y="62" font-size="12">capacity</text>
    </g>

    <g transform="translate(748 314)">
      <rect width="154" height="88" rx="19" fill="#ffffff" stroke="#f3e8ff"/>
      <circle cx="34" cy="34" r="13" fill="#f3e8ff"/>
      <path d="M27 42c9-22 17-22 27 0" fill="none" stroke="#7e22ce" stroke-width="3" stroke-linecap="round"/>
      <text class="label" x="58" y="38" font-size="17">Exports</text>
      <text class="micro" x="58" y="62" font-size="12">global demand</text>
    </g>

    <g transform="translate(558 392)">
      <rect width="188" height="92" rx="19" fill="#ffffff" stroke="#fee2e2"/>
      <circle cx="36" cy="35" r="13" fill="#fee2e2"/>
      <path d="M29 29l17 17M46 29 29 46" fill="none" stroke="#b91c1c" stroke-width="3" stroke-linecap="round"/>
      <text class="label" x="64" y="38" font-size="17">Food Loss</text>
      <text class="micro" x="64" y="62" font-size="12">spoilage, waste</text>
    </g>

    <g transform="translate(230 392)">
      <rect width="194" height="92" rx="19" fill="#ffffff" stroke="#fef3c7"/>
      <circle cx="36" cy="35" r="13" fill="#fef3c7"/>
      <path d="M28 42h24M34 30h18" fill="none" stroke="#b45309" stroke-width="3" stroke-linecap="round"/>
      <text class="label" x="64" y="38" font-size="17">Affordability</text>
      <text class="micro" x="64" y="62" font-size="12">income, price</text>
    </g>

    <g transform="translate(58 314)">
      <rect width="164" height="88" rx="19" fill="#ffffff" stroke="#dbeafe"/>
      <circle cx="34" cy="34" r="13" fill="#dbeafe"/>
      <path d="M28 39c5-9 10-15 18-15 7 0 12 5 14 12" fill="none" stroke="#2563eb" stroke-width="3" stroke-linecap="round"/>
      <text class="label" x="58" y="38" font-size="17">Demand</text>
      <text class="micro" x="58" y="62" font-size="12">need, access</text>
    </g>

    <g transform="translate(56 194)">
      <rect width="164" height="88" rx="19" fill="#ffffff" stroke="#dcfce7"/>
      <circle cx="34" cy="34" r="13" fill="#dcfce7"/>
      <path d="M27 41h24M39 27v24" fill="none" stroke="#15803d" stroke-width="3" stroke-linecap="round"/>
      <text class="label" x="58" y="38" font-size="17">Supply</text>
      <text class="micro" x="58" y="62" font-size="12">production</text>
    </g>
  </g>

  <g font-family="Inter, Arial, sans-serif" font-weight="800" fill="#334155">
    <text x="480" y="512" text-anchor="middle" font-size="16">Changing one variable can reshape the whole system.</text>
  </g>
</svg>
